name: Tests

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

jobs:
  unit:
    name: Unit + golden tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: Cache Dart dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Run unit tests
        run: dart test --exclude-tags integration

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: Cache Dart dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Only the services supadart talks to: Postgres, PostgREST, Storage, Kong.
      - name: Start Supabase
        run: >
          supabase start -x
          studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,postgres-meta,supavisor

      - name: Run all tests
        run: tool/test_integration.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

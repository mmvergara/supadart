# Publishes to pub.dev when a version tag (e.g. v2.0.0) is pushed.
# Uses pub.dev's GitHub OIDC automated publishing, so no secrets are stored here.
# https://dart.dev/tools/pub/automated-publishing
name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  # Creates the GitHub release for the tag, using its section of CHANGELOG.md.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## / { found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
